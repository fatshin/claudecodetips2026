name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # PRトリガー時の自動レビュープロンプト
          direct_prompt: |
            このPRをレビューしてください。観点:
            1. 正しさ（仕様一致・エッジケース）
            2. セキュリティ（入力検証・認証認可・機密扱い）
            3. テスト網羅性
            4. パフォーマンス影響

            重大度別（Critical / Major / Minor）でコメント。
            Critical があればマージ不可と明記。
          # @claudeメンション時はコメント内容に従う
          allowed_tools: "Bash(npm test*),Bash(npm run lint*),Bash(git diff*),Read,Grep,Glob"
          # 公式リファレンス: https://github.com/anthropics/claude-code-action
