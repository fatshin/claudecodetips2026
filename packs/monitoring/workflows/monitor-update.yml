name: Claude Code Kit Monitoring

# Boris Cherny発信、Claude Code公式docs、GitHub releases を週次/月次で監視し、
# このKitへのアップデート提案を自動生成してIssue起票する。

on:
  schedule:
    # 週次: 毎週月曜 JST 10:00（UTC 1:00）
    - cron: '0 1 * * 1'
    # 月次: 毎月1日 JST 9:00（UTC 0:00）
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: false
        type: choice
        default: 'weekly'
        options:
          - weekly
          - monthly
          - full

permissions:
  contents: write    # snapshotコミット用
  issues: write      # 提案Issue起票用
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code & Gemini CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @google/gemini-cli || true   # Boris検索のため、無くても続行

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lynx jq
          # gh CLI は ubuntu-latest にプリインストール済

      - name: Run monitoring
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x packs/monitoring/scripts/*.sh
          bash packs/monitoring/scripts/run-monitoring.sh

      - name: Find latest snapshot
        id: snapshot
        run: |
          LATEST=$(ls -d packs/monitoring/snapshots/*/ 2>/dev/null | sort | tail -1)
          echo "dir=$LATEST" >> $GITHUB_OUTPUT
          
          if [ -f "${LATEST}update-proposal.md" ]; then
            echo "has_proposal=true" >> $GITHUB_OUTPUT
          else
            echo "has_proposal=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit snapshot
        if: steps.snapshot.outputs.dir != ''
        run: |
          git config --local user.email "monitoring@bot"
          git config --local user.name "Claude Code Monitoring Bot"
          
          # _diff ディレクトリは大量ファイルなので除外
          # snapshotルートと update-proposal.md のみコミット
          git add packs/monitoring/snapshots/ || true
          
          if ! git diff --cached --quiet; then
            git commit -m "monitoring: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Create Issue with proposal
        if: steps.snapshot.outputs.has_proposal == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          PROPOSAL="${{ steps.snapshot.outputs.dir }}update-proposal.md"
          
          BODY=$(cat <<EOF
          ## 自動生成されたアップデート提案
          
          - 実行日時: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - スナップショット: \`${{ steps.snapshot.outputs.dir }}\`
          - 元データ: コミット履歴で確認可
          
          ---
          
          $(cat "$PROPOSAL")
          
          ---
          
          ## アクションアイテム
          
          - [ ] 提案内容のレビュー
          - [ ] 即時対応項目を別Issueに切り出し
          - [ ] 自家製パックの公式移行検討
          - [ ] 棄却する提案の理由を記録
          EOF
          )
          
          # Title重複防止: 同日Issueがあれば追記、無ければ新規
          EXISTING=$(gh issue list --label "kit-update,automated" --state open \
                       --json number,title --jq ".[] | select(.title | contains(\"$DATE\")) | .number" \
                       | head -1)
          
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "✓ 既存Issue #$EXISTING に追記"
          else
            gh issue create \
              --title "[Kit Update] $DATE 自動アップデート提案" \
              --label "kit-update,automated" \
              --body "$BODY"
            echo "✓ 新規Issue起票"
          fi

      - name: Comment if no changes
        if: steps.snapshot.outputs.has_proposal != 'true'
        run: |
          echo "ℹ 変更なし。Issue起票スキップ。"
